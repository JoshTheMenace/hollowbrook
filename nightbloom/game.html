<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nightbloom — 宵坂</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #14121f; }
      #view { width: 100vw; height: 100vh; display: block; outline: none; }
      #prompt {
        position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
        color: #f2ecdf; font: 600 14px/1.5 ui-rounded, system-ui, sans-serif;
        background: rgba(20, 16, 34, 0.72); border: 1px solid rgba(140, 120, 180, 0.35);
        border-radius: 10px; padding: 7px 16px; pointer-events: none;
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.4); white-space: nowrap;
      }
      #prompt:empty { display: none; }
      #phase {
        position: fixed; top: 14px; right: 16px; color: #cfc4e8;
        font: 700 12px ui-rounded, system-ui, sans-serif; letter-spacing: 2px;
        opacity: 0.75; pointer-events: none; text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <canvas id="view" tabindex="0"></canvas>
    <div id="hurtflash" style="position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 55%,rgba(255,60,80,0.45));opacity:0;transition:opacity 0.25s"></div>
    <div id="prompt"></div>
    <div id="phase"></div>
    <div id="deathscreen" style="display:none;position:fixed;inset:0;z-index:11;background:rgba(8,4,14,0.72);align-items:center;justify-content:center;flex-direction:column;font-family:ui-rounded,system-ui,sans-serif;text-align:center">
      <div style="color:#ff5a6e;font-size:30px;font-weight:800;letter-spacing:2px;text-shadow:0 0 22px rgba(255,60,90,0.45)">the bloom takes another</div>
      <div id="death-time" style="color:#f2ecdf;font-size:20px;font-weight:700;margin-top:16px"></div>
      <div id="death-sum" style="color:#cfc4e8;font-size:14px;margin-top:8px;opacity:0.85"></div>
      <div style="color:#8f84b8;font-size:12px;margin-top:26px;letter-spacing:1px">ENTER — return to dawn</div>
    </div>
    <div id="levelup" style="display:none;position:fixed;inset:0;z-index:10;background:rgba(8,6,18,0.55);align-items:center;justify-content:center;flex-direction:column;font-family:ui-rounded,system-ui,sans-serif">
      <div style="color:#cdb4ff;font-size:26px;font-weight:800;letter-spacing:1px;text-shadow:0 0 18px rgba(140,100,255,0.5);margin-bottom:14px">the bloom offers…</div>
      <div id="cards" style="display:flex;gap:14px"></div>
    </div>
    <style>
      #cards .up { width: 165px; border: 3px solid #5a4a86; border-radius: 14px; padding: 15px 12px; background: rgba(20,16,38,0.95); color: #ece8fa; cursor: pointer; transition: transform 0.1s, border-color 0.1s; }
      #cards .up:hover { border-color: #b08aff; transform: translateY(-5px); }
      #cards .lbl { font-weight: 800; font-size: 15px; margin-bottom: 5px; }
      #cards .dsc { font-size: 12px; opacity: 0.7; line-height: 1.4; }
      #cards .key { font-size: 11px; opacity: 0.45; margin-top: 9px; }
    </style>
    <script type="module" src="/src/game/main.js"></script>
  </body>
</html>
