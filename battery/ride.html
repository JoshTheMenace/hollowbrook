<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intensity Ride</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #16121f; font-family: ui-rounded, system-ui, sans-serif; }
      #view { width: 100vw; height: 100vh; display: block; outline: none; }
      .hud { position: fixed; pointer-events: none; color: #f2ecdf; text-shadow: 0 2px 0 rgba(10, 6, 20, 0.6); }
      #tag { top: 14px; left: 18px; font-size: 12px; font-weight: 700; letter-spacing: 2px; opacity: 0.7; text-transform: uppercase; color: #cfc4e8; }
      #hpwrap { top: 36px; left: 18px; width: 220px; height: 12px; background: rgba(20, 16, 34, 0.75); border-radius: 6px; overflow: hidden; }
      #hp { height: 100%; width: 100%; background: #7cf5a0; transition: width 0.12s, background 0.3s; }
      #stats { top: 54px; left: 18px; font-size: 13px; font-weight: 700; opacity: 0.85; }
      #clock { top: 14px; right: 18px; font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
      #tier { top: 58px; right: 18px; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #ffd9a0; opacity: 0.85; }
      #vignette { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.25s; background: radial-gradient(ellipse at center, transparent 50%, rgba(255, 60, 60, 0.55) 100%); }
      #cards { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; gap: 16px; background: rgba(10, 6, 20, 0.55); z-index: 10; }
      .card { width: 190px; background: rgba(28, 22, 46, 0.97); border: 2px solid #5a4a86; border-left: 4px solid #ffd9a0; border-radius: 4px 12px 12px 4px; padding: 16px 18px; color: #ece8fa; cursor: pointer; transition: transform 0.1s, border-color 0.1s; }
      .card:hover { transform: translateY(-4px); border-color: #ffd9a0; }
      .card .key { font-size: 11px; color: #ffd9a0; letter-spacing: 2px; margin-bottom: 6px; }
      .card .label { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
      .card .desc { font-size: 12.5px; opacity: 0.8; line-height: 1.45; }
      #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 6, 20, 0.6); z-index: 11; }
      #panel { background: rgba(28, 22, 46, 0.96); border: 3px solid #5a4a86; border-radius: 18px; padding: 30px 48px; text-align: center; color: #ece8fa; max-width: 520px; }
      #panel h1 { margin: 0 0 4px; font-size: 38px; color: #ffd9a0; letter-spacing: 2px; }
      #panel .sub { opacity: 0.6; margin: 0 0 14px; }
      #panel .big { font-size: 46px; font-weight: 800; color: #6ee0ff; margin: 6px 0; }
      #panel .hint { font-size: 13px; opacity: 0.75; line-height: 1.7; }
      #panel .start { font-weight: 800; color: #6ee0ff; animation: pulse 1.4s infinite; margin-top: 12px; }
      @keyframes pulse { 50% { opacity: 0.4; } }
    </style>
  </head>
  <body>
    <canvas id="view" tabindex="0"></canvas>
    <div id="vignette"></div>
    <div class="hud" id="tag">intensity ride</div>
    <div class="hud" id="hpwrap"><div id="hp"></div></div>
    <div class="hud" id="stats"></div>
    <div class="hud" id="clock">3:00</div>
    <div class="hud" id="tier"></div>
    <div id="cards"></div>
    <div id="overlay">
      <div id="panel">
        <h1>INTENSITY RIDE</h1>
        <p class="sub">three minutes · the street outside the café · dusk to night</p>
        <div id="result" style="display:none"><div class="big" id="finalline"></div><div id="finalstats" class="sub"></div></div>
        <p class="hint">WASD to move — your blade swings on its own.<br>Collect the gems they drop; pick a card when you level.<br>Survive the whole ride. Something big comes at 2:30.</p>
        <p class="start" id="startline">press any direction to begin</p>
      </div>
    </div>
    <script type="module" src="/src/ride/main.js"></script>
  </body>
</html>
